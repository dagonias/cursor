apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pds-wifi
  namespace: monitor-wifi
  labels:
    app: pds-wifi
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: monitor-wifi.infraero.gov.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pds-wifi
                port:
                  name: http
  # Descomente se tiver TLS/cert-manager:
  # tls:
